[project]
name = "store-api"
version = "0.1.0"
description = "NestKart Store API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pyjwt[crypto]==2.10.1",
    "cryptography==44.0.0",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.20",
    "pillow==11.1.0",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "tzdata==2024.2",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "hypothesis==6.123.0",
    "ruff==0.8.6",
    "mypy==1.14.0",
    "pip-audit==2.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
